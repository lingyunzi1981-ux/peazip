name: West Beauty Windows Build

on:
  workflow_dispatch:
  push:
    branches: [sources, codex/ximei-windows-stability]
    paths:
      - 'peazip-sources/**'
      - '.github/workflows/westbeauty-windows.yml'
      - '.github/workflows/ChineseSimplified.isl'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate PowerShell scripts
        run: |
          foreach ($file in Get-ChildItem .github/scripts/*.ps1) {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List *; throw "Invalid script: $file" }
          }
      - name: Install Lazarus and build PeaZip
        run: |
          & .github/workflows/setup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Lazarus build failed' }
      - name: Build complete Unicode installer
        run: .github/scripts/build-westbeauty.ps1
      - name: Verify Windows installation and archive operations
        run: .github/scripts/test-westbeauty.ps1
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: WestBeautyCompression-Windows-x64
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WestBeautyCompression-Windows-evidence
          path: ${{ runner.temp }}/westbeauty-evidence/
          if-no-files-found: warn
