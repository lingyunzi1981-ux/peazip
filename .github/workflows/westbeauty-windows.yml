name: West Beauty Windows Build

on:
  workflow_dispatch:
  push:
    branches: [sources]
    paths:
      - 'peazip-sources/**'
      - '.github/workflows/westbeauty-windows.yml'

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Lazarus and build PeaZip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -File '.github/workflows/setup.ps1'

      - name: Collect Windows executables
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Get-ChildItem -Path . -Recurse -File -Include *.exe |
            Where-Object { $_.FullName -notmatch '\\.git\\' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination (Join-Path artifact $_.Name) -Force
            }
          $peaZip = Get-ChildItem artifact -Filter 'peazip.exe' | Select-Object -First 1
          if (-not $peaZip) { throw 'peazip.exe was not produced.' }
          Copy-Item $peaZip.FullName -Destination (Join-Path artifact 'WestBeautyCompression.exe') -Force
          Copy-Item $peaZip.FullName -Destination (Join-Path artifact '西美压缩.exe') -Force
          Get-ChildItem artifact
          if (-not (Test-Path (Join-Path artifact '西美压缩.exe'))) { throw '西美压缩.exe was not produced.' }

      - name: Build Chinese installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          $exe = (Resolve-Path 'artifact/WestBeautyCompression.exe').Path
          # Build a complete runtime stage. The source tree intentionally contains placeholders
          # for third-party compression backends, so seed the runtime from the official PeaZip
          # WIN64 portable package, then replace the GUI and PEA binaries with this fork's builds.
          $stage = Join-Path $env:RUNNER_TEMP 'WestBeautyRuntime'
          $portableZip = Join-Path $env:RUNNER_TEMP 'peazip-portable.zip'
          $portableExtract = Join-Path $env:RUNNER_TEMP 'peazip-portable'
          Invoke-WebRequest -Uri 'https://github.com/peazip/PeaZip/releases/download/11.2.0/peazip_portable-11.2.0.WIN64.zip' -OutFile $portableZip
          Expand-Archive -Path $portableZip -DestinationPath $portableExtract -Force
          $portableRoot = Get-ChildItem $portableExtract -Directory | Select-Object -First 1
          if (-not $portableRoot) { throw 'Official PeaZip portable runtime could not be extracted.' }
          Copy-Item $portableRoot.FullName $stage -Recurse -Force
          Copy-Item $exe (Join-Path $stage 'peazip.exe') -Force
          Copy-Item $exe (Join-Path $stage '西美压缩.exe') -Force
          $peaBuilt = Get-ChildItem artifact -Filter 'pea.exe' | Select-Object -First 1
          if ($peaBuilt) { Copy-Item $peaBuilt.FullName (Join-Path $stage 'pea.exe') -Force }
          if (-not (Test-Path (Join-Path $stage 'res\\bin\\7z'))) { throw '7z runtime backend missing from stage.' }
          if (-not (Test-Path (Join-Path $stage 'pea.exe'))) { throw 'pea.exe missing from stage.' }
          if (-not (Test-Path (Join-Path $stage 'res'))) { throw 'res runtime folder missing from stage.' }
          $license = (Resolve-Path 'LICENSE').Path
          $lang = (Resolve-Path '.github/workflows/ChineseSimplified.isl').Path
          $iss = Join-Path $env:RUNNER_TEMP 'westbeauty.iss'
          $lines = @(
            '[Setup]',
            'AppId={{7F79973A-49E8-4B57-A2D9-575754424731}',
            'AppName=西美压缩',
            'AppVerName=西美压缩 11.3.0',
            'AppVersion=11.3.0',
            'AppPublisher=West Beauty Group',
            'DefaultDirName={autopf}\\西美压缩',
            'DefaultGroupName=西美压缩',
            'UninstallDisplayName=西美压缩',
            'OutputDir=output',
            'OutputBaseFilename=WestBeautyCompression-Setup-x64',
            'Compression=lzma2/max',
            'SolidCompression=yes',
            'ArchitecturesAllowed=x64compatible',
            'ArchitecturesInstallIn64BitMode=x64compatible',
            'WizardStyle=modern',
            'PrivilegesRequired=admin',
            ('LicenseFile=' + $license),
            '',
            '[Languages]',
            ('Name: "chinesesimp"; MessagesFile: "' + $lang + '"'),
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加选项："; Flags: checkedonce',
            'Name: "contextmenu"; Description: "添加到 Windows 右键菜单"; GroupDescription: "附加选项："; Flags: checkedonce',
            '',
            '[Files]',
            ('Source: "' + $stage + '\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs'),
            ('Source: "' + $license + '"; DestDir: "{app}"; DestName: "LICENSE.txt"; Flags: ignoreversion'),
            '',
            '[Icons]',
            'Name: "{group}\\西美压缩"; Filename: "{app}\\西美压缩.exe"',
            'Name: "{group}\\卸载 西美压缩"; Filename: "{uninstallexe}"',
            'Name: "{autodesktop}\\西美压缩"; Filename: "{app}\\西美压缩.exe"; Tasks: desktopicon',
            '',
            '[Registry]',
            'Root: HKCR; Subkey: "*\\shell\\WestBeautyCompress"; ValueType: string; ValueName: ""; ValueData: "西美压缩 - 添加到压缩文件..."; Flags: uninsdeletekey; Tasks: contextmenu',
            'Root: HKCR; Subkey: "*\\shell\\WestBeautyCompress"; ValueType: string; ValueName: "Icon"; ValueData: "{app}\\西美压缩.exe"; Tasks: contextmenu',
            'Root: HKCR; Subkey: "*\\shell\\WestBeautyCompress\\command"; ValueType: string; ValueName: ""; ValueData: """{app}\\西美压缩.exe"" -add2archive ""%1"""; Tasks: contextmenu',
            'Root: HKCR; Subkey: "*\\shell\\WestBeautyOpen"; ValueType: string; ValueName: ""; ValueData: "用西美压缩打开"; Flags: uninsdeletekey; Tasks: contextmenu',
            'Root: HKCR; Subkey: "*\\shell\\WestBeautyOpen\\command"; ValueType: string; ValueName: ""; ValueData: """{app}\\西美压缩.exe"" ""%1"""; Tasks: contextmenu',
            '',
            '[Run]',
            'Filename: "{app}\\西美压缩.exe"; Description: "运行 西美压缩"; Flags: nowait postinstall skipifsilent'
          )
          Set-Content -Path $iss -Value $lines -Encoding UTF8
          Push-Location $env:RUNNER_TEMP
          & "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" $iss
          Pop-Location
          $builtInstaller = Join-Path $env:RUNNER_TEMP 'output\\WestBeautyCompression-Setup-x64.exe'
          if (-not (Test-Path $builtInstaller)) { throw 'Installer was not produced.' }
          $delivery = Join-Path $env:RUNNER_TEMP 'delivery'
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null
          Copy-Item $builtInstaller (Join-Path $delivery 'WestBeautyCompression-Setup-x64.exe') -Force
          $installerSize = (Get-Item $builtInstaller).Length
          if ($installerSize -lt 10000000) { throw "Installer is unexpectedly small ($installerSize bytes); runtime payload is likely incomplete." }
          @('西美压缩.exe','pea.exe','res') | ForEach-Object {
            if (-not (Test-Path (Join-Path $stage $_))) { throw "Runtime payload missing: $_" }
          }
          if (-not (Test-Path (Join-Path $stage 'res\\bin\\7z'))) { throw 'Runtime payload missing: res\\bin\\7z' }
          Get-ChildItem $delivery

      - name: Silent install and smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'delivery\WestBeautyCompression-Setup-x64.exe'
          if (-not (Test-Path $installer)) { throw 'Installer missing before smoke test.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'WestBeautyInstalled'
          $p = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $installDir)) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent installer failed with exit code $($p.ExitCode)." }

          $required = @(
            (Join-Path $installDir '西美压缩.exe'),
            (Join-Path $installDir 'pea.exe'),
            (Join-Path $installDir 'res')
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Installed runtime missing: $item" }
          }

          $sevenZipRoot = Join-Path $installDir 'res\bin\7z'
          if (-not (Test-Path $sevenZipRoot)) { throw 'Installed 7z backend directory missing.' }
          $sevenZipFiles = Get-ChildItem $sevenZipRoot -Recurse -File -ErrorAction Stop
          if (-not $sevenZipFiles -or $sevenZipFiles.Count -eq 0) { throw 'Installed 7z backend directory is empty.' }
          Write-Host "Installed 7z backend files:"
          $sevenZipFiles | Select-Object FullName,Length

          $app = Join-Path $installDir '西美压缩.exe'
          $proc = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) { throw "西美压缩 exited unexpectedly with code $($proc.ExitCode)." }
            Write-Host '西美压缩 started and exited cleanly.'
          } else {
            Write-Host "西美压缩 launched successfully. PID=$($proc.Id)"
            Stop-Process -Id $proc.Id -Force
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
          }
          Write-Host 'Silent install, runtime checks, 7z backend check, and GUI launch smoke test passed.'

      - name: Upload final installer
        uses: actions/upload-artifact@v4
        with:
          name: WestBeautyCompression-Windows-x64
          path: |
            ${{ runner.temp }}/delivery/
          if-no-files-found: error
